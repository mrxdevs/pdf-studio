name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the job you need done, not just the solution.
      placeholder: I fill in the same government form every month and have to re-type my name and address each time.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like PDF Studio to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This idea can work fully in the browser, without uploading the user's file anywhere.
          required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself.
